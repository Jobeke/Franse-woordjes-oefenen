const $=id=>document.getElementById(id),y=$('y'),m=$('m'),a=$('a'),d=$('d'),q=$('q'),ans=$('ans'),fb=$('fb'),next=$('next'),check=$('check'),end=$('end'),p=$('p'),meta=$('meta');let deck=[],i=0,good=0,wrong=[],locked=false;const norm=s=>s.trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[()]/g,'').replace(/\s+/g,' ');function shuffle(x){x=[...x];for(let j=x.length-1;j;j--){let k=Math.floor(Math.random()*(j+1));[x[j],x[k]]=[x[k],x[j]]}return x}function accepts(t,g){let n=norm(t),v=[n];if(n.includes(', '))v.push(...n.split(', ').map(norm));if(n.includes(' / '))v.push(...n.split(' / ').map(norm));return v.includes(norm(g))}function show(){end.classList.add('hidden');if(i>=deck.length){q.textContent='Oefening voltooid';ans.disabled=check.disabled=true;next.classList.add('hidden');p.style.width='100%';end.classList.remove('hidden');$('endtxt').textContent=`Je had ${good} van ${deck.length} antwoorden juist. ${wrong.length?wrong.length+' woord(en) kun je opnieuw oefenen.':'Alles juist!'}`;$('retry').style.display=wrong.length?'inline-block':'none';return}locked=false;ans.disabled=check.disabled=false;next.classList.add('hidden');fb.textContent='';ans.value='';let x=deck[i];q.textContent=d.value==='nlfr'?x[3]:x[2];meta.textContent=`${y.value}e leerjaar · Module ${x[0]} · Acte ${x[1]} · ${i+1} van ${deck.length} · Score ${good}/${i}`;p.style.width=(i/deck.length*100)+'%';ans.focus()}function start(custom){let source=y.value==='6'?W6:W5;deck=shuffle(custom||source.filter(x=>(m.value==='all'||String(x[0])===m.value)&&(a.value==='all'||String(x[1])===a.value)));i=good=0;wrong=[];show()}$('start').onclick=()=>start();$('check').onclick=()=>{if(locked||!ans.value.trim())return;locked=true;let x=deck[i],t=d.value==='nlfr'?x[2]:x[3];if(accepts(t,ans.value)){good++;fb.innerHTML='<span class="ok"><b>✓ Juist!</b></span>'}else{wrong.push(x);fb.innerHTML=`<span class="bad"><b>✗ Nog niet.</b></span><br>Juiste antwoord: <b>${t}</b>`}ans.disabled=check.disabled=true;next.classList.remov
