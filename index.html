const $=id=>document.getElementById(id);
let deck=[], pos=0, good=0, wrong=[], locked=false, hardMode=false;
const HARD_KEY='frans_moeilijke_woorden_v1';
function loadHard(){try{return JSON.parse(localStorage.getItem(HARD_KEY)||'{}')}catch(e){return {}}}
function saveHard(x){localStorage.setItem(HARD_KEY,JSON.stringify(x)); updateHardInfo()}
function keyFor(item){return item.fr+'|||'+item.nl}
function markWrong(item){
 const h=loadHard(), k=keyFor(item);
 h[k]={fr:item.fr,nl:item.nl,streak:0,wrong:(h[k]?.wrong||0)+1};
 saveHard(h);
}
function markRight(item){
 const h=loadHard(), k=keyFor(item);
 if(!h[k]) return;
 h[k].streak=(h[k].streak||0)+1;
 if(h[k].streak>=2) delete h[k];
 saveHard(h);
}
function updateHardInfo(){
 const n=Object.keys(loadHard()).length;
 $('hardInfo').textContent=n ? `Moeilijke woorden bewaard op dit toestel: ${n}` : 'Nog geen moeilijke woorden bewaard op dit toestel.';
}
function startHard(){
 const h=Object.values(loadHard());
 if(!h.length){alert('Er zijn nog geen moeilijke woorden om te oefenen.');return}
 deck=shuffle(h.map(x=>({fr:x.fr,nl:x.nl})));
 pos=0;good=0;wrong=[];hardMode=true;$('quiz').style.display='block';show();
}

function refreshModules(){
 const y=$('year').value, mods=Object.keys(DATA[y]).map(Number).sort((a,b)=>a-b);
 $('module').innerHTML=mods.map(m=>`<option value="${m}">Module ${m}</option>`).join('');
 refreshActes();
}
function refreshActes(){
 const y=$('year').value,m=$('module').value, acts=Object.keys(DATA[y][m]).map(Number).sort((a,b)=>a-b);
 $('acte').innerHTML=acts.map(a=>`<option value="${a}">Acte ${a}</option>`).join('');
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function compact(s){
 return s.normalize('NFC').toLowerCase().trim()
  .replace(/[’‘`´]/g,"'").replace(/\s+/g,' ')
  .replace(/\s*([,;:/])\s*/g,'$1');
}
function optionalVariants(s){
 let out=new Set([s]);
 // Parenthesized text may be typed with or without parentheses, while retaining the text.
 out.add(s.replace(/[()]/g,''));
 // Parenthesized fragments may also be omitted when they are explicitly optional on the card.
 out.add(s.replace(/\s*\([^)]*\)/g,'').replace(/\s+/g,' ').trim());
 // Handle forms like (s')habiller and (s’) amuser.
 out.add(s.replace(/[()]/g,'').replace(/\s+/g,' ').trim());
 return [...out].map(compact);
}
function alternatives(s){
 // slash separates alternatives; commas generally represent listed forms/meanings
 let base=[s];
 if(s.includes(' / ')) base.push(...s.split(' / '));
 if(s.includes(' ou ')) base.push(...s.split(' ou '));
 if(s.includes(',')) base.push(...s.split(','));
 let out=new Set();
 base.forEach(x=>optionalVariants(x).forEach(v=>out.add(v)));
 // A few typographic equivalents.
 [...out].forEach(v=>{out.add(v.replace(/œ/g,'oe'));});
 return [...out];
}
function isCorrect(input, expected){return alternatives(expected).includes(compact(input));}
function start(){
 const y=$('year').value,m=$('module').value,a=$('acte').value;
 deck=shuffle(DATA[y][m][a].map(x=>({fr:x[0],nl:x[1]}))); hardMode=false;
 pos=0;good=0;wrong=[];$('quiz').style.display='block'; show();
}
function show(){
 if(pos>=deck.length){
   if(wrong.length){
     deck=shuffle(wrong); wrong=[]; pos=0;
     $('feedback').className='feedback'; $('feedback').textContent='We oefenen nu de woorden die nog niet juist waren.';
   } else {
     $('prompt').textContent='Klaar! 🎉'; $('answer').style.display='none'; $('check').style.display='none'; $('next').style.display='none';
     $('progress').textContent='Alles geoefend'; $('score').textContent=`Juist: ${good}`; return;
   }
 }
 locked=false;$('answer').style.display='block';$('check').style.display='inline-block';$('next').style.display='none';
 $('answer').value='';$('answer').focus();$('feedback').textContent='';$('feedback').className='feedback';
 const d=$('direction').value, item=deck[pos];
 $('prompt').textContent=d==='nlfr'?item.nl:item.fr;
 $('progress').textContent=`Woord ${pos+1} van ${deck.length}`;
 $('score').textContent=`Juist: ${good}`;
}
function check(){
 if(locked||!$('answer').value.trim()) return;
 locked=true; const item=deck[pos], d=$('direction').value, expected=d==='nlfr'?item.fr:item.nl;
 if(isCorrect($('answer').value,expected)){
   good++; markRight(item); $('feedback').className='feedback good'; $('feedback').textContent='✓ Juist!';
 } else {
   wrong.push(item); markWrong(item); $('feedback').className='feedback bad'; $('feedback').textContent='Niet juist. Dit woord komt later opnieuw. Correct: '+expected;
 }
 $('score').textContent=`Juist: ${good}`;$('check').style.display='none';$('next').style.display='inline-block';$('next').focus();
}
function next(){pos++;show()}
$('year').addEventListener('change',refreshModules);$('module').addEventListener('change',refreshActes);
$('start').addEventListener('click',start);$('hardStart').addEventListener('click',startHard);$('check').addEventListener('click',check);$('next').addEventListener('click',next);
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();locked?next():check()}});
